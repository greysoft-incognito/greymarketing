name: App

on:
  push:
    branches: ["main", "dev"]
    paths: ["app/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/app.yml"]
  pull_request:
    branches: ["main", "dev"]
    paths: ["app/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/app.yml"]

jobs:
  build:
    runs-on: ubuntu-latest

    name: Type check and build

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm app:typecheck

      - name: Build
        run: pnpm app:build
